name: Chinese tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tools/zh-cn/localize-ui.test.mjs
  migration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 7
        shell: pwsh
        run: ./tools/zh-cn/test-maintenance.ps1
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./tools/zh-cn/test-maintenance.ps1
